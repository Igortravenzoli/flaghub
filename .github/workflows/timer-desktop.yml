# Instaladores do Timer Flag para macOS e Linux (o de Windows sai na máquina
# do time: `npm run dist:win` em desktop/). Roda à mão (Actions → Run workflow)
# ou a cada push no ramo de build do desktop. Os arquivos ficam como artefato
# do run por 3 dias: baixar e subir na pasta "liberação" do SharePoint com o
# MESMO nome (TimerFlag.dmg, TimerFlag.AppImage).
#
# Sem assinatura Apple: o .dmg é universal (Intel + Apple Silicon) com
# assinatura ad-hoc; na primeira abertura o macOS pede "Abrir mesmo assim"
# em Ajustes › Privacidade e Segurança.
name: Timer desktop (macOS e Linux)

on:
  workflow_dispatch:
  push:
    branches: ['claude/timer-desktop-mac']
    paths: ['desktop/**', '.github/workflows/timer-desktop.yml']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Sem certificado Apple, o electron-builder não assina nada, e um app
      # sem assinatura não abre no Mac com chip Apple ("está danificado").
      # Então: monta o .app, assina ad-hoc com o codesign e só depois o .dmg.
      - name: Montar o .app universal
        run: npx electron-builder --mac dir --universal -c.mac.identity=null
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Assinar ad-hoc
        run: |
          codesign --force --deep --sign - "release/mac-universal/Timer Flag.app"
          codesign --verify --deep --strict --verbose=2 "release/mac-universal/Timer Flag.app"
      - name: Gerar o .dmg
        run: npx electron-builder --mac dmg --universal -c.mac.identity=null --prepackaged "release/mac-universal/Timer Flag.app"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: TimerFlag-macos
          path: desktop/release/TimerFlag.dmg
          retention-days: 3
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: TimerFlag-linux
          path: desktop/release/TimerFlag.AppImage
          retention-days: 3
          if-no-files-found: error
